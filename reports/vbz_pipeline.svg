<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" style="font-family: system-ui, -apple-system, sans-serif; font-size: 12px; background: #ffffff;">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Heading ── -->
  <text x="380" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">VBZ Master Dataset — Merge Pipeline</text>

  <!-- ══ SOURCE CARDS ══ -->

  <!-- IST-Daten (teal) -->
  <rect x="20" y="50" width="158" height="108" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <rect x="20" y="50" width="158" height="26" rx="8" fill="#0F6E56"/>
  <rect x="20" y="68" width="158" height="8" fill="#0F6E56"/>
  <text x="99" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">IST-Daten</text>
  <text x="99" y="96" text-anchor="middle" font-size="11" fill="#085041">~1.035 Parquets</text>
  <text x="99" y="112" text-anchor="middle" font-size="11" fill="#085041">87,9 Mio Zeilen · 8 Spalten</text>
  <text x="99" y="128" text-anchor="middle" font-size="11" fill="#085041">501 MB · Polars</text>
  <text x="99" y="146" text-anchor="middle" font-size="10" fill="#0F6E56" font-style="italic">Basis — keine Join-Spalte nötig</text>

  <!-- GTFS (blue) -->
  <rect x="198" y="50" width="158" height="108" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <rect x="198" y="50" width="158" height="26" rx="8" fill="#185FA5"/>
  <rect x="198" y="68" width="158" height="8" fill="#185FA5"/>
  <text x="277" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">GTFS Stops</text>
  <text x="277" y="96" text-anchor="middle" font-size="11" fill="#0C447C">4 Parquets (2023–2025)</text>
  <text x="277" y="112" text-anchor="middle" font-size="11" fill="#0C447C">stop_name, stop_lat, stop_lon</text>
  <text x="277" y="128" text-anchor="middle" font-size="11" fill="#0C447C">Referenzjahr: 2024</text>
  <text x="277" y="146" text-anchor="middle" font-size="10" fill="#185FA5" font-style="italic">Join: BPUIC = stop_id</text>

  <!-- Meteo (blue) -->
  <rect x="376" y="50" width="168" height="108" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <rect x="376" y="50" width="168" height="26" rx="8" fill="#185FA5"/>
  <rect x="376" y="68" width="168" height="8" fill="#185FA5"/>
  <text x="460" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Meteo Master</text>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#0C447C">1 Parquet · 11 Spalten</text>
  <text x="460" y="112" text-anchor="middle" font-size="11" fill="#0C447C">stündlich · 2023–2025</text>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#0C447C">UGZ + Wapo + ERZ</text>
  <text x="460" y="146" text-anchor="middle" font-size="10" fill="#185FA5" font-style="italic">Join: floor(ANKUNFTSZEIT, 1h) = date_time</text>

  <!-- Events (blue) -->
  <rect x="564" y="50" width="176" height="108" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <rect x="564" y="50" width="176" height="26" rx="8" fill="#185FA5"/>
  <rect x="564" y="68" width="176" height="8" fill="#185FA5"/>
  <text x="652" y="67" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Events Master</text>
  <text x="652" y="96" text-anchor="middle" font-size="11" fill="#0C447C">1 CSV · 5 Spalten</text>
  <text x="652" y="112" text-anchor="middle" font-size="11" fill="#0C447C">tagesgenau · ~251 Einträge</text>
  <text x="652" y="128" text-anchor="middle" font-size="11" fill="#0C447C">Feiertage, Events, Fussball</text>
  <text x="652" y="146" text-anchor="middle" font-size="10" fill="#185FA5" font-style="italic">Join: date(BETRIEBSTAG) = Datum</text>

  <!-- ══ DIVIDER ══ -->
  <line x1="20" y1="175" x2="740" y2="175" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="380" y="171" text-anchor="middle" font-size="9" fill="#bbb">left join — alle Fahrten bleiben erhalten, fehlende Werte → null</text>

  <!-- ══ ARROWS down ══ -->
  <!-- IST straight -->
  <line x1="99" y1="158" x2="99" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GTFS curved -->
  <path d="M277 158 L277 220 L101 220" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Meteo curved -->
  <path d="M460 158 L460 232 L101 232" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Events curved -->
  <path d="M652 158 L652 244 L101 244" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- ══ FEATURE COLUMNS BOX ══ -->
  <rect x="20" y="265" width="720" height="90" rx="8" fill="#f8f8f8" stroke="#ddd" stroke-width="0.8"/>
  <text x="380" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#444">Spalten im Master-Datensatz</text>

  <!-- Column groups -->
  <rect x="32" y="293" width="158" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="111" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#0F6E56">IST-Daten (8)</text>
  <text x="111" y="322" text-anchor="middle" font-size="10" fill="#085041">BETRIEBSTAG · LINIEN_TEXT</text>
  <text x="111" y="335" text-anchor="middle" font-size="10" fill="#085041">BPUIC · AN/AB_DELAY</text>

  <rect x="200" y="293" width="148" height="52" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="274" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#185FA5">GTFS (3)</text>
  <text x="274" y="322" text-anchor="middle" font-size="10" fill="#0C447C">stop_name</text>
  <text x="274" y="335" text-anchor="middle" font-size="10" fill="#0C447C">stop_lat · stop_lon</text>

  <rect x="358" y="293" width="178" height="52" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="447" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#185FA5">Meteo (11)</text>
  <text x="447" y="322" text-anchor="middle" font-size="10" fill="#0C447C">temperature · rain_duration</text>
  <text x="447" y="335" text-anchor="middle" font-size="10" fill="#0C447C">precipitation_mm · wind … +7</text>

  <rect x="546" y="293" width="182" height="52" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="637" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#185FA5">Events (4)</text>
  <text x="637" y="322" text-anchor="middle" font-size="10" fill="#0C447C">Event_Name · Typ</text>
  <text x="637" y="335" text-anchor="middle" font-size="10" fill="#0C447C">Gewichtung · Ort</text>

  <!-- ══ ARROW to master ══ -->
  <line x1="380" y1="355" x2="380" y2="385" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ MASTER OUTPUT ══ -->
  <rect x="20" y="388" width="720" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="380" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">vbz_master.parquet</text>
  <text x="380" y="432" text-anchor="middle" font-size="11" fill="#534AB7">87,9 Mio Zeilen · 26 Spalten · ~2 GB  —  bereit für EDA, Modellierung, Dashboard</text>

</svg>
